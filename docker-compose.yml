services:
  api:
    build: .
    # rasterio/fiona/GDAL don't publish manylinux_aarch64 wheels, so on
    # Apple Silicon (or any arm64 host) pip falls back to a source build,
    # which fails with modern pip/setuptools regardless of version pinned
    # (see Dockerfile comment). Building for amd64 (via Docker Desktop's
    # Rosetta emulation) gets the real prebuilt wheels instead of fighting
    # that build -- also the realistic choice since most cloud hosts this
    # would eventually deploy to are x86_64 anyway.
    platform: linux/amd64
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      # No login UI exists in frontend/ yet — there's nowhere for an
      # operator to enter a per-user API key. Auth-disabled is the
      # honest setting until that's built, not a security oversight.
      # Flip to false + supply real keys once an auth UI exists.
      - AFFI_AUTH_DISABLED=true
      - AFFI_API_KEYS_FILE=/app/config/api_keys.json
      - AFFI_CORS_ORIGINS=http://localhost:3000
      # Dashboard assistant (routes_chat.py). Set ANTHROPIC_API_KEY in your
      # shell or a .env file next to docker-compose.yml; it is passed through
      # here and never reaches the browser. AFFI_CHAT_MODEL is optional.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AFFI_CHAT_MODEL=${AFFI_CHAT_MODEL:-claude-haiku-4-5-20251001}
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api

  # src/dashboard/eoc_dashboard.py (Streamlit) is superseded by
  # frontend/ — same alert/forecast/model-performance data, now a real
  # React app instead. Not deleted (still runnable manually via
  # `streamlit run` if ever wanted), just no longer part of the default
  # stack — running two live dashboards side by side served no purpose.
  # dashboard:
  #   build: .
  #   ports:
  #     - "8501:8501"
  #   command: streamlit run src/dashboard/eoc_dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
  #   depends_on:
  #     - api

  scheduler:
    build: .
    platform: linux/amd64  # same rasterio/GDAL wheel-availability reason as api, above
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    command: python scripts/scheduler.py
    restart: unless-stopped
    # Not an HTTP service, so it can't answer the api image's inherited
    # HEALTHCHECK (curls localhost:8000/health, a port this container never
    # listens on) -- without this it always shows "unhealthy" in `docker
    # compose ps` even while working correctly, which reads as broken during
    # a demo. Disabling it here, not by removing the HEALTHCHECK from the
    # shared image, since the api service still needs it.
    healthcheck:
      disable: true
    depends_on:
      - api

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - AFFI_AUTH_DISABLED=false
      - AFFI_API_KEYS_FILE=/app/config/api_keys.json
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./config:/app/config
    environment:
      - PYTHONPATH=/app
    command: streamlit run src/dashboard/eoc_dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    restart: unless-stopped
    depends_on:
      - api

  scheduler:
    build: .
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    command: python scripts/scheduler.py
    restart: unless-stopped
    depends_on:
      - api

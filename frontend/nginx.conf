server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the API container — avoids CORS entirely in
    # production (the frontend and backend are on different origins
    # only in local dev, where CORS_ORIGINS handles it instead).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
    }

    # Generated flood maps / hydrographs / thumbnails are served by the API
    # container's StaticFiles mount at /outputs/. Without this proxy, the SPA
    # fallback below (try_files -> /index.html) answered every /outputs/*.png
    # request with a 200 + HTML body, so the browser's <img> got HTML instead
    # of a PNG and every generated image on the dashboard showed
    # "Image not available." Same-origin proxy, same pattern as /api/.
    location /outputs/ {
        proxy_pass http://api:8000/outputs/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
